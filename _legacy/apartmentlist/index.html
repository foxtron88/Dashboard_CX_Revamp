<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApartmentList Web App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Top Navigation -->
    <nav class="navbar glass">
        <div class="logo" onclick="window.router.navigate('/')">
            <i class="fa-solid fa-building"></i> ApartmentList
        </div>
        <ul class="nav-links">
            <li><a href="#/" class="nav-item" data-path="/">Home</a></li>
            <li><a href="#/favorites" class="nav-item" data-path="/favorites">Favorites <span id="fav-count" class="badge">0</span></a></li>
        </ul>
        <div class="nav-actions">
            <button class="btn btn-outline"><i class="fa-regular fa-user"></i> Login</button>
        </div>
    </nav>

    <!-- SPA Root Container -->
    <main id="app">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ApartmentList Web App. All rights reserved.</p>
    </footer>

    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
